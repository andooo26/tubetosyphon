# Build the Windows app on a Windows runner:
#   1. npm ci
#   2. npm run make      -> Squirrel Setup.exe installer + portable zip
#   3. smoke test        -> the packaged exe boots and can issue tab-capture ids
#   4. benchmark         -> both decks + projector, main-thread lag / CPU / fps
# Download the results from the run's "Artifacts" section.
name: build-windows

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run make
      - name: List outputs
        shell: pwsh
        run: Get-ChildItem -Recurse out/make | Select-Object FullName, Length
      - name: Smoke test packaged app
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse out -Filter 'Tube to Syphon.exe' |
            Where-Object { $_.FullName -notmatch '\\make\\' } |
            Select-Object -First 1
          if (-not $exe) { throw 'packaged exe not found' }
          $env:U2S_SELFTEST = '1'
          # A GUI-subsystem exe: Start-Process -Wait so we really wait for it.
          $p = Start-Process -FilePath $exe.FullName -Wait -PassThru `
            -RedirectStandardOutput selftest.out -RedirectStandardError selftest.err
          Get-Content selftest.out, selftest.err
          if (-not (Select-String -Path selftest.out, selftest.err -Pattern 'U2S_SELFTEST' -Quiet)) {
            throw 'self-test did not report'
          }
          if ($p.ExitCode -ne 0) { throw "self-test failed (exit $($p.ExitCode))" }
      # Reproduce "both decks + projector" and record main-thread lag, CPU per
      # process and the projector's per-deck fps (see src/bench.ts). The
      # summary is emitted as a notice annotation so it is readable from the
      # run page without downloading logs.
      - name: Benchmark VJ + projector
        shell: pwsh
        continue-on-error: true
        run: |
          $exe = Get-ChildItem -Recurse out -Filter 'Tube to Syphon.exe' |
            Where-Object { $_.FullName -notmatch '\\make\\' } |
            Select-Object -First 1
          $env:U2S_SELFTEST = ''
          $env:U2S_BENCH = 'vjproj'
          $env:U2S_BENCH_SECONDS = '20'
          $p = Start-Process -FilePath $exe.FullName -Wait -PassThru `
            -RedirectStandardOutput bench.out -RedirectStandardError bench.err
          Get-Content bench.out, bench.err | Select-String 'U2S_BENCH' | ForEach-Object {
            $line = $_.Line -replace '^.*U2S_BENCH ', ''
            Write-Output "::notice title=bench::$line"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: tube-to-syphon-windows-setup
          path: out/make/squirrel.windows/x64/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: tube-to-syphon-windows-portable
          path: out/make/zip/win32/x64/*.zip
